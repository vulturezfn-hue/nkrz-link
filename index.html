<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NKRZ Streamer Rewards</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1016;color:#e8edf4;font:16px/1.5 system-ui,Segoe UI,sans-serif;padding:16px;box-sizing:border-box}
  .c{max-width:460px;width:100%;background:#151a23;border:1px solid #232b38;border-radius:14px;padding:28px;text-align:center}
  h1{font-size:22px;margin:12px 0 6px}p{color:#9aa6b6;margin:0 0 14px}
  .spin{width:40px;height:40px;margin:0 auto;border-radius:50%;border:4px solid #232b38;border-top-color:#17a3d6;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:#17a3d6;word-break:break-all}.b{margin-top:16px;font-size:12px;color:#6b7686;letter-spacing:.12em}
</style>
</head>
<body>
<div class="c">
  <div class="spin"></div>
  <h1>Linking your account...</h1>
  <p>Sending you back to the NKRZ server. This takes a second.</p>
  <p id="manual" hidden>Not moving? <a id="go" href="#">Click here</a></p>
  <div class="b">NKRZ STREAMER REWARDS</div>
</div>
<script>
  // No editing needed: the NKRZ server puts its own address in the sign-in link,
  // so this page just sends you back to it.
  (function () {
    var q = new URLSearchParams(window.location.search);
    var state = q.get('state') || '';
    // opened with nothing (someone just visited the site): show what this is
    if (!state && !q.get('code') && !q.get('error')) {
      document.querySelector('.spin').hidden = true;
      document.querySelector('h1').textContent = 'NKRZ Streamer Rewards';
      document.querySelector('p').innerHTML = 'Stream the NKRZ FiveM server on Twitch, Kick or TikTok and earn in-game coins. '
        + 'Link your account in game with <b>/linkstream</b> or in our Discord with <b>/stream link</b>, then sign in to confirm the channel is yours.'
        + '<br><br><a href="terms.html">Terms of Service</a> &middot; <a href="privacy.html">Privacy Policy</a> &middot; <a href="https://discord.gg/nkrz">Discord</a>';
      return;
    }
    var part = state.split('~')[1] || '';
    var server = '';
    try { server = atob(part.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((part.length + 3) % 4)); } catch (e) {}
    if (!/^https?:\/\/[^\s]+$/.test(server)) {
      document.querySelector('h1').textContent = 'Link not valid';
      document.querySelector('p').textContent = 'Go back in game (or Discord) and use /linkstream or /stream link again.';
      document.querySelector('.spin').hidden = true;
      return;
    }
    var url = server.replace(/\/+$/, '') + '/streamers/cb' + window.location.search;
    document.getElementById('go').href = url;
    setTimeout(function () { document.getElementById('manual').hidden = false; }, 2500);
    window.location.replace(url);
  })();
</script>
</body>
</html>
